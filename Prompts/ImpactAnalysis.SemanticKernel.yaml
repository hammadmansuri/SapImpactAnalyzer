template_format: semantic-kernel
template: |
  You are an SAP impact analysis expert. Analyze transport request {{TransportId}} comprehensively.

  1. Use SAPAnalysis-GetTransportDetailsAsync to get transport details
  2. Use SAPAnalysis-AnalyzeDependenciesAsync to analyze dependencies
  3. Use SAPAnalysis-CalculateRiskAssessment to assess risk
  4. Provide detailed impact analysis in JSON format

  Required JSON structure:
  ExecutiveSummary: summary text
  RiskLevel: Low|Medium|High|Critical
  KeyRisks:
    - risk1
    - risk2
  BusinessImpacts:
    - impact1
    - impact2
  TestingScope:
    - area1
    - area2
  TestingRecommendations:
    - action1
    - action2
  RollbackComplexity: Low|Medium|High
  RollbackStrategy:
    - strategy1
    - strategy2
  EstimatedEffort: hours or days
  ConfidenceScore: 1-100

input_variables:
  - name: TransportId
    description: SAP transport request number to analyze
